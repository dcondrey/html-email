          <!-- Hero: full-width image + card (eyebrow + headline + intro) -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#ffffff;">
            <tr>
              <td align="center" valign="top" style="font-size:0; line-height:0;">
                <a href="{{heroLinkUrl}}" target="_blank" style="text-decoration:none;"><img src="{{heroImageUrl}}" width="600" height="360" alt="{{heroImageAlt}}" class="fluid" style="width:100%; max-width:600px; height:auto; display:block; border:0;"></a>
              </td>
            </tr>
            <tr>
              <td class="pad-on-narrow" style="padding:36px 40px 40px 40px;">
                <div style="font-family:'Oswald',Arial,Helvetica,sans-serif; font-size:13px; line-height:18px; letter-spacing:3px; text-transform:uppercase; color:#c8811f; padding-bottom:10px;">{{heroEyebrow}}</div>
                <div class="darkmode-text" style="font-family:'Oswald',Arial,Helvetica,sans-serif; font-weight:600; font-size:34px; line-height:38px; text-transform:uppercase; letter-spacing:1px; color:#3a2417; padding-bottom:14px;">{{heroHeadline}}</div>
                <div class="darkmode-muted" style="font-family:'Oswald',Arial,Helvetica,sans-serif; font-weight:300; font-size:16px; line-height:28px; color:#6b5847;">{{heroText}}</div>
              </td>
            </tr>
          </table>
