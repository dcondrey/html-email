          <!-- Logo + nav. Two fluid-hybrid columns: logo left, nav right; they
               stack centered on narrow screens (ghost tables keep Outlook a real
               two-cell row). Logo swaps light/dark variant for the inverted card. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#ffffff;">
            <tr>
              <td align="center" valign="middle" class="pad-on-narrow" style="padding:22px 30px; font-size:0; text-align:center;">
                <!--[if mso]><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="196" valign="middle"><![endif]-->
                <div class="stack-column center-on-narrow" style="display:inline-block; width:100%; max-width:196px; vertical-align:middle; text-align:left;">
                  <a href="{{logoLinkUrl}}" target="_blank" class="darkmode-hide" style="text-decoration:none;"><img src="{{logoUrl}}" width="180" height="32" alt="{{companyName}}" style="display:block; border:0;" class="center-on-narrow"></a>
                  <a href="{{logoLinkUrl}}" target="_blank" class="darkmode-show center-on-narrow" style="display:none; text-decoration:none;"><img src="{{logoDarkUrl}}" width="180" height="32" alt="{{companyName}}" style="display:block; border:0;" class="center-on-narrow"></a>
                </div>
                <!--[if mso]></td><td valign="middle"><![endif]-->
                <div class="stack-column center-on-narrow" style="display:inline-block; width:100%; max-width:374px; vertical-align:middle;">
                  <div class="darkmode-text center-on-narrow" style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-size:12px; line-height:26px; letter-spacing:1px; text-transform:uppercase; color:#3a3d45; text-align:right;">
                    <a href="#" target="_blank" style="color:#3a3d45; text-decoration:none;">{{nav1}}</a> &nbsp;&nbsp;
                    <a href="#" target="_blank" style="color:#3a3d45; text-decoration:none;">{{nav2}}</a> &nbsp;&nbsp;
                    <a href="#" target="_blank" style="color:#3a3d45; text-decoration:none;">{{nav3}}</a> &nbsp;&nbsp;
                    <a href="#" target="_blank" style="color:#3a3d45; text-decoration:none;">{{nav4}}</a> &nbsp;&nbsp;
                    <a href="#" target="_blank" style="color:#ee6c4d; text-decoration:none;">{{nav5}}</a>
                  </div>
                </div>
                <!--[if mso]></td></tr></table><![endif]-->
              </td>
            </tr>
          </table>
