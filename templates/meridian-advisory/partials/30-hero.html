          <!-- Hero: full-width image + card (eyebrow + headline + intro + coral
               bulletproof button). Restrained corporate layout. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#ffffff;">
            <tr>
              <td align="center" valign="top" style="font-size:0; line-height:0;">
                <a href="{{heroLinkUrl}}" target="_blank" style="text-decoration:none;"><img src="{{heroImageUrl}}" width="600" height="340" alt="{{heroImageAlt}}" class="fluid" style="width:100%; max-width:600px; height:auto; display:block; border:0;"></a>
              </td>
            </tr>
            <tr>
              <td class="pad-on-narrow" style="padding:40px 44px 44px 44px;">
                <div style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:600; font-size:12px; line-height:16px; letter-spacing:3px; text-transform:uppercase; color:#ee6c4d; padding-bottom:14px;">{{heroEyebrow}}</div>
                <div class="darkmode-text" style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:600; font-size:32px; line-height:40px; color:#2c2f36; padding-bottom:16px;">{{heroHeadline}}</div>
                <div class="darkmode-muted" style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:400; font-size:15px; line-height:26px; color:#7a7e88; padding-bottom:28px;">{{heroText}}</div>
                <!--[if mso]>
                <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{heroUrl}}" style="height:46px;v-text-anchor:middle;width:190px;" arcsize="10%" strokecolor="#ee6c4d" fillcolor="#ee6c4d">
                  <w:anchorlock/><center style="color:#ffffff;font-family:Arial,sans-serif;font-size:14px;font-weight:bold;letter-spacing:1px;">{{heroButton}}</center>
                </v:roundrect>
                <![endif]-->
                <!--[if !mso]><!-->
                <a href="{{heroUrl}}" target="_blank" style="background:#ee6c4d; border-radius:5px; color:#ffffff; display:inline-block; font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-size:14px; font-weight:600; letter-spacing:1px; text-transform:uppercase; line-height:46px; text-align:center; text-decoration:none; padding:0 34px; mso-hide:all;">{{heroButton}}</a>
                <!--<![endif]-->
              </td>
            </tr>
          </table>
