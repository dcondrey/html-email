          {{>gap}}
          <!-- Service B: text + image right, side by side, stacking on narrow.
               Text column first in source = left in the ghost table. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#ffffff; border-radius:4px;">
            <tr>
              <td align="center" valign="top" style="font-size:0; text-align:center;">

                <!--[if mso]><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td valign="top"><![endif]-->
                <div class="stack-column" style="display:inline-block; width:100%; max-width:340px; vertical-align:top;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td class="pad-on-narrow" style="padding:34px 36px;">
                        <div style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:600; font-size:12px; line-height:16px; letter-spacing:2px; text-transform:uppercase; color:#ee6c4d; padding-bottom:10px;">{{serviceBEyebrow}}</div>
                        <div class="darkmode-text" style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:600; font-size:22px; line-height:28px; color:#2c2f36; padding-bottom:12px;">{{serviceBTitle}}</div>
                        <div class="darkmode-muted" style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:400; font-size:14px; line-height:24px; color:#7a7e88; padding-bottom:16px;">{{serviceBText}}</div>
                        <div style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:600; font-size:13px; line-height:18px; letter-spacing:1px; text-transform:uppercase;"><a href="{{serviceBUrl}}" target="_blank" style="color:#ee6c4d; text-decoration:none;">{{serviceBLink}} &rarr;</a></div>
                      </td>
                    </tr>
                  </table>
                </div>
                <!--[if mso]></td><td width="240" valign="top"><![endif]-->
                <div class="stack-column" style="display:inline-block; width:100%; max-width:240px; vertical-align:top;">
                  <img src="{{serviceBImageUrl}}" width="240" height="200" alt="{{serviceBTitle}}" class="fluid" style="width:100%; max-width:240px; height:auto; display:block; border:0; border-radius:0 4px 4px 0;">
                </div>
                <!--[if mso]></td></tr></table><![endif]-->

              </td>
            </tr>
          </table>
