          {{>gap}}
          <!-- Stats band: three fluid-hybrid metrics; ghost tables give Outlook a
               real three-cell row. Big coral figures over charcoal labels. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#ffffff; border-radius:4px;">
            <tr>
              <td align="center" valign="top" class="pad-on-narrow" style="padding:40px 24px; font-size:0; text-align:center;">

                <!--[if mso]><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="33%" valign="top"><![endif]-->
                <div class="stack-third" style="display:inline-block; width:100%; max-width:180px; vertical-align:top; padding:8px 6px;">
                  <div style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:700; font-size:38px; line-height:44px; color:#ee6c4d; text-align:center;">{{stat1Number}}</div>
                  <div class="darkmode-muted" style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:500; font-size:12px; line-height:18px; letter-spacing:1px; text-transform:uppercase; color:#7a7e88; text-align:center; padding-top:6px;">{{stat1Label}}</div>
                </div>
                <!--[if mso]></td><td width="33%" valign="top"><![endif]-->
                <div class="stack-third" style="display:inline-block; width:100%; max-width:180px; vertical-align:top; padding:8px 6px;">
                  <div style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:700; font-size:38px; line-height:44px; color:#ee6c4d; text-align:center;">{{stat2Number}}</div>
                  <div class="darkmode-muted" style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:500; font-size:12px; line-height:18px; letter-spacing:1px; text-transform:uppercase; color:#7a7e88; text-align:center; padding-top:6px;">{{stat2Label}}</div>
                </div>
                <!--[if mso]></td><td width="33%" valign="top"><![endif]-->
                <div class="stack-third" style="display:inline-block; width:100%; max-width:180px; vertical-align:top; padding:8px 6px;">
                  <div style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:700; font-size:38px; line-height:44px; color:#ee6c4d; text-align:center;">{{stat3Number}}</div>
                  <div class="darkmode-muted" style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:500; font-size:12px; line-height:18px; letter-spacing:1px; text-transform:uppercase; color:#7a7e88; text-align:center; padding-top:6px;">{{stat3Label}}</div>
                </div>
                <!--[if mso]></td></tr></table><![endif]-->

              </td>
            </tr>
          </table>
