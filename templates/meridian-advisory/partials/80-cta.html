          {{>gap}}
          <!-- CTA: restrained white card, charcoal headline, coral bulletproof
               (VML) button. Corporate tone — no loud colour band here. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#ffffff; border-radius:4px;">
            <tr>
              <td align="center" class="pad-on-narrow" style="padding:48px 44px;">
                <div class="darkmode-text" style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:600; font-size:26px; line-height:34px; color:#2c2f36; text-align:center; padding-bottom:12px;">{{ctaHeadline}}</div>
                <div class="darkmode-muted" style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:400; font-size:15px; line-height:26px; color:#7a7e88; text-align:center; padding-bottom:28px;">{{ctaText}}</div>
                <!--[if mso]>
                <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{ctaUrl}}" style="height:46px;v-text-anchor:middle;width:220px;" arcsize="10%" strokecolor="#ee6c4d" fillcolor="#ee6c4d">
                  <w:anchorlock/><center style="color:#ffffff;font-family:Arial,sans-serif;font-size:14px;font-weight:bold;letter-spacing:1px;">{{ctaButton}}</center>
                </v:roundrect>
                <![endif]-->
                <!--[if !mso]><!-->
                <a href="{{ctaUrl}}" target="_blank" style="background:#ee6c4d; border-radius:5px; color:#ffffff; display:inline-block; font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-size:14px; font-weight:600; letter-spacing:1px; text-transform:uppercase; line-height:46px; text-align:center; text-decoration:none; padding:0 34px; mso-hide:all;">{{ctaButton}}</a>
                <!--<![endif]-->
              </td>
            </tr>
          </table>
