          {{>gap}}
          <!-- Quote block (the signature): a charcoal, full-bleed testimonial —
               the dark centerpiece. Fixed dark background in every mode (NOT a
               darkmode-card), a big coral quote mark, the quote, and attribution. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#2c2f36; border-radius:4px;">
            <tr>
              <td align="center" class="pad-on-narrow" style="padding:50px 48px 46px 48px;">
                <div style="font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:64px; line-height:40px; color:#ee6c4d; text-align:center; padding-bottom:14px;">&ldquo;</div>
                <div style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:400; font-size:22px; line-height:34px; color:#f2f3f5; text-align:center; padding-bottom:26px;">{{quoteText}}</div>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td style="width:40px; height:2px; font-size:0; line-height:0; background-color:#ee6c4d;">&nbsp;</td></tr></table>
                <div style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:600; font-size:15px; line-height:20px; color:#ffffff; text-align:center; padding-top:20px;">{{quoteName}}</div>
                <div style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif; font-weight:400; font-size:13px; line-height:18px; color:#9aa0ab; text-align:center; padding-top:4px;">{{quoteRole}}</div>
              </td>
            </tr>
          </table>
