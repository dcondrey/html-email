          <!-- Header bar: date + view-in-browser, rounded top -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#c3d3b2; border-radius:10px 10px 0 0;">
            <tr>
              <td class="pad-on-narrow" style="padding:16px 30px; font-family:'Poppins',Arial,Helvetica,sans-serif; font-size:12px; line-height:16px; text-transform:uppercase; color:#ffffff;">

                  <tr>

                    <td align="right" class="darkmode-text" style="color:#ffffff; font-family:'Poppins',Arial,Helvetica,sans-serif; font-size:12px; line-height:16px; text-transform:uppercase;"><a href="{{viewInBrowserUrl}}" target="_blank" style="color:#ffffff; text-decoration:none;">Open in your browser</a></td>

                </table>
              </td>
            </tr>
