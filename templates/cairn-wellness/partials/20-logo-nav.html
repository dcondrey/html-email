          <!-- Logo + nav. Two fluid-hybrid columns: logo left, nav right;
               they stack centered on narrow screens (ghost tables keep Outlook
               a real two-cell row). -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#ffffff;">
            <tr>
              <td align="center" valign="middle" class="pad-on-narrow" style="padding:22px 30px; font-size:0; text-align:center;">
                <!--[if mso]><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="180" valign="middle"><![endif]-->
                <div class="stack-column center-on-narrow" style="display:inline-block; width:100%; max-width:180px; vertical-align:middle; text-align:left;">
                  <!-- Logo swap: deep-green wordmark on the white light card; the
                       light-sage variant replaces it where prefers-color-scheme:dark
                       is honoured, so it stays legible on the inverted card. -->
                  <a href="{{logoLinkUrl}}" target="_blank" class="darkmode-hide" style="text-decoration:none;"><img src="{{logoUrl}}" width="150" height="30" alt="{{companyName}}" style="display:block; border:0;" class="center-on-narrow"></a>
                  <a href="{{logoLinkUrl}}" target="_blank" class="darkmode-show center-on-narrow" style="display:none; text-decoration:none;"><img src="{{logoDarkUrl}}" width="150" height="30" alt="{{companyName}}" style="display:block; border:0;" class="center-on-narrow"></a>
                </div>
                <!--[if mso]></td><td valign="middle"><![endif]-->
                <div class="stack-column center-on-narrow" style="display:inline-block; width:100%; max-width:400px; vertical-align:middle;">
                  <div class="darkmode-text center-on-narrow" style="font-family:'Poppins',Arial,Helvetica,sans-serif; font-size:13px; line-height:26px; text-transform:uppercase; color:#445942; text-align:right;">
                    <a href="#" target="_blank" style="color:#445942; text-decoration:none;">{{nav1}}</a> &nbsp;&nbsp;
                    <a href="#" target="_blank" style="color:#445942; text-decoration:none;">{{nav2}}</a> &nbsp;&nbsp;
                    <a href="#" target="_blank" style="color:#445942; text-decoration:none;">{{nav3}}</a> &nbsp;&nbsp;
                    <a href="#" target="_blank" style="color:#445942; text-decoration:none;">{{nav4}}</a> &nbsp;&nbsp;
                    <a href="#" target="_blank" style="color:#445942; text-decoration:none;">{{nav5}}</a>
                  </div>
                </div>
                <!--[if mso]></td></tr></table><![endif]-->
              </td>
            </tr>
          </table>
