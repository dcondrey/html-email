          <!-- Two cream cards. Fluid-hybrid: two .stack-column inline-blocks;
               ghost tables give Outlook a real two-cell row. Each card has a
               bulletproof (VML) amber pill button. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td align="center" valign="top" style="font-size:0; text-align:center;">
