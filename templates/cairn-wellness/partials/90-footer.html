          {{>gap}}
          <!-- Footer: social + name + address + unsubscribe. Off-white card,
               not pure black/white, so dark-mode inversion stays graceful. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#f6efe7; border-radius:10px;">
            <tr>
              <td align="center" class="pad-on-narrow" style="padding:44px 40px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin-bottom:24px;">
                  <tr>
                    <td style="padding:0 5px;"><a href="{{facebookUrl}}" target="_blank"><img src="{{iconFacebook}}" width="28" height="28" alt="{{companyName}} on Facebook" style="display:block; border:0;"></a></td>
                    <td style="padding:0 5px;"><a href="{{twitterUrl}}" target="_blank"><img src="{{iconTwitter}}" width="28" height="28" alt="{{companyName}} on Twitter" style="display:block; border:0;"></a></td>
                    <td style="padding:0 5px;"><a href="{{instagramUrl}}" target="_blank"><img src="{{iconInstagram}}" width="28" height="28" alt="{{companyName}} on Instagram" style="display:block; border:0;"></a></td>
                    <td style="padding:0 5px;"><a href="{{pinterestUrl}}" target="_blank"><img src="{{iconPinterest}}" width="28" height="28" alt="{{companyName}} on Pinterest" style="display:block; border:0;"></a></td>
                  </tr>
                </table>
                <div class="darkmode-text" style="font-family:'Poppins',Arial,Helvetica,sans-serif; font-size:16px; line-height:22px; color:#445942; padding-bottom:8px;">{{companyName}}</div>
                <div class="darkmode-muted" style="font-family:'Poppins',Arial,Helvetica,sans-serif; font-size:12px; line-height:20px; color:#777777; padding-bottom:16px;">{{companyAddress}}</div>
                <div class="darkmode-muted" style="font-family:'Poppins',Arial,Helvetica,sans-serif; font-size:12px; line-height:18px; color:#999999; padding-bottom:16px;"><a href="{{unsubscribeUrl}}" target="_blank" style="color:#999999; text-decoration:underline;">Unsubscribe</a> from this mailing list.</div>
                <div class="darkmode-muted" style="font-family:'Poppins',Arial,Helvetica,sans-serif; font-size:11px; line-height:16px; color:#999999;">{{legalText}}</div>
              </td>
            </tr>
          </table>
