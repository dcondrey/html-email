          <!-- Hero: full-width image + white card (headline + intro), rounded bottom -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#ffffff;">
            <tr>
              <td align="center" valign="top" style="font-size:0; line-height:0;">
                <a href="{{heroLinkUrl}}" target="_blank" style="text-decoration:none;"><img src="{{heroImageUrl}}" width="600" alt="{{heroImageAlt}}" class="fluid" style="width:100%; max-width:600px; height:auto; display:block; border:0;"></a>
              </td>
            </tr>
            <tr>
              <td class="pad-on-narrow" style="padding:36px 40px 40px 40px;">
                <div class="darkmode-text" style="font-family:'Poppins',Arial,Helvetica,sans-serif; font-size:28px; line-height:34px; color:#445942; padding-bottom:14px;">{{heroHeadline}}</div>
                <div class="darkmode-muted" style="font-family:'Poppins',Arial,Helvetica,sans-serif; font-size:15px; line-height:28px; color:#777777;">{{heroText}}</div>
              </td>
            </tr>
          </table>
