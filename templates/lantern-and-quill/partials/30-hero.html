          <!-- Hero: full-width image + card (eyebrow + serif headline + intro +
               coral bulletproof button). Serif headings fall back to Georgia. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#ffffff;">
            <tr>
              <td align="center" valign="top" style="font-size:0; line-height:0;">
                <a href="{{heroLinkUrl}}" target="_blank" style="text-decoration:none;"><img src="{{heroImageUrl}}" width="600" height="360" alt="{{heroImageAlt}}" class="fluid" style="width:100%; max-width:600px; height:auto; display:block; border:0;"></a>
              </td>
            </tr>
            <tr>
              <td class="pad-on-narrow" style="padding:38px 44px 42px 44px;">
                <div style="font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:16px; letter-spacing:3px; text-transform:uppercase; color:#f2b544; padding-bottom:14px;">{{heroEyebrow}}</div>
                <div class="darkmode-text" style="font-family:'Playfair Display',Georgia,'Times New Roman',serif; font-weight:700; font-size:32px; line-height:40px; color:#3a3550; padding-bottom:16px;">{{heroHeadline}}</div>
                <div class="darkmode-muted" style="font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:26px; color:#7a7385; padding-bottom:28px;">{{heroText}}</div>
                <!--[if mso]>
                <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{heroUrl}}" style="height:46px;v-text-anchor:middle;width:180px;" arcsize="50%" strokecolor="#e5674f" fillcolor="#e5674f">
                  <w:anchorlock/><center style="color:#ffffff;font-family:Arial,sans-serif;font-size:14px;font-weight:bold;letter-spacing:1px;">{{heroButton}}</center>
                </v:roundrect>
                <![endif]-->
                <!--[if !mso]><!-->
                <a href="{{heroUrl}}" target="_blank" style="background:#e5674f; border-radius:23px; color:#ffffff; display:inline-block; font-family:Arial,Helvetica,sans-serif; font-size:14px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; line-height:46px; text-align:center; text-decoration:none; padding:0 34px; mso-hide:all;">{{heroButton}}</a>
                <!--<![endif]-->
              </td>
            </tr>
          </table>
