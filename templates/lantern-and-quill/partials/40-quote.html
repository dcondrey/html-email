          {{>gap}}
          <!-- Quote band: a single serif line on warm yellow, a big coral quote
               mark above it. A literary beat between the hero and the team. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2b544; border-radius:8px;">
            <tr>
              <td align="center" class="pad-on-narrow" style="padding:44px 44px 48px 44px;">
                <div style="font-family:'Playfair Display',Georgia,'Times New Roman',serif; font-weight:700; font-size:52px; line-height:30px; color:#e5674f; text-align:center; padding-bottom:8px;">&ldquo;</div>
                <div style="font-family:'Playfair Display',Georgia,'Times New Roman',serif; font-weight:600; font-size:24px; line-height:34px; font-style:italic; color:#3a3550; text-align:center;">{{quoteText}}</div>
                <div style="font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:16px; letter-spacing:2px; text-transform:uppercase; color:#8a6a1f; text-align:center; padding-top:18px;">{{quoteAttribution}}</div>
              </td>
            </tr>
          </table>
