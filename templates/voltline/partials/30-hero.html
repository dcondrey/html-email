          <!-- Hero: full-width device image + card (pink eyebrow + big headline
               + intro + pink bulletproof button) on an elevated dark panel. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#1a1a24;">
            <tr>
              <td align="center" valign="top" style="font-size:0; line-height:0;">
                <a href="{{heroLinkUrl}}" target="_blank" style="text-decoration:none;"><img src="{{heroImageUrl}}" width="600" height="360" alt="{{heroImageAlt}}" class="fluid" style="width:100%; max-width:600px; height:auto; display:block; border:0;"></a>
              </td>
            </tr>
            <tr>
              <td class="pad-on-narrow" style="padding:38px 44px 42px 44px;">
                <div style="font-family:'Space Grotesk',Arial,Helvetica,sans-serif; font-weight:500; font-size:12px; line-height:16px; letter-spacing:4px; text-transform:uppercase; color:#ff3d7f; padding-bottom:14px;">{{heroEyebrow}}</div>
                <div class="darkmode-text" style="font-family:'Space Grotesk',Arial,Helvetica,sans-serif; font-weight:700; font-size:36px; line-height:42px; color:#ffffff; padding-bottom:16px;">{{heroHeadline}}</div>
                <div class="darkmode-muted" style="font-family:'Space Grotesk',Arial,Helvetica,sans-serif; font-weight:400; font-size:15px; line-height:26px; color:#9a9ab0; padding-bottom:28px;">{{heroText}}</div>
                <!--[if mso]>
                <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{heroUrl}}" style="height:48px;v-text-anchor:middle;width:190px;" arcsize="14%" strokecolor="#ff3d7f" fillcolor="#ff3d7f">
                  <w:anchorlock/><center style="color:#ffffff;font-family:Arial,sans-serif;font-size:14px;font-weight:bold;letter-spacing:1px;">{{heroButton}}</center>
                </v:roundrect>
                <![endif]-->
                <!--[if !mso]><!-->
                <a href="{{heroUrl}}" target="_blank" style="background:#ff3d7f; border-radius:7px; color:#ffffff; display:inline-block; font-family:'Space Grotesk',Arial,Helvetica,sans-serif; font-size:14px; font-weight:700; letter-spacing:1px; text-transform:uppercase; line-height:48px; text-align:center; text-decoration:none; padding:0 36px; mso-hide:all;">{{heroButton}}</a>
                <!--<![endif]-->
              </td>
            </tr>
          </table>
