          <!-- Logo + nav. Two fluid-hybrid columns: logo left, nav right; they
               stack centered on narrow screens (ghost tables keep Outlook a real
               two-cell row). Dark card, so one logo works in every mode. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="darkmode-card" style="background-color:#1a1a24;">
            <tr>
              <td align="center" valign="middle" class="pad-on-narrow" style="padding:22px 30px; font-size:0; text-align:center;">
                <!--[if mso]><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="180" valign="middle"><![endif]-->
                <div class="stack-column center-on-narrow" style="display:inline-block; width:100%; max-width:180px; vertical-align:middle; text-align:left;">
                  <a href="{{logoLinkUrl}}" target="_blank" style="text-decoration:none;"><img src="{{logoUrl}}" width="150" height="30" alt="{{companyName}}" style="display:block; border:0;" class="center-on-narrow"></a>
                </div>
                <!--[if mso]></td><td valign="middle"><![endif]-->
                <div class="stack-column center-on-narrow" style="display:inline-block; width:100%; max-width:390px; vertical-align:middle;">
                  <div class="center-on-narrow" style="font-family:'Space Grotesk',Arial,Helvetica,sans-serif; font-size:13px; line-height:26px; letter-spacing:1px; text-transform:uppercase; color:#cdcdda; text-align:right;">
                    <a href="#" target="_blank" style="color:#cdcdda; text-decoration:none;">{{nav1}}</a> &nbsp;&nbsp;
                    <a href="#" target="_blank" style="color:#cdcdda; text-decoration:none;">{{nav2}}</a> &nbsp;&nbsp;
                    <a href="#" target="_blank" style="color:#cdcdda; text-decoration:none;">{{nav3}}</a> &nbsp;&nbsp;
                    <a href="#" target="_blank" style="color:#cdcdda; text-decoration:none;">{{nav4}}</a> &nbsp;&nbsp;
                    <a href="#" target="_blank" style="color:#ff3d7f; text-decoration:none;">{{nav5}}</a>
                  </div>
                </div>
                <!--[if mso]></td></tr></table><![endif]-->
              </td>
            </tr>
          </table>
